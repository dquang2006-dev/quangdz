<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MultiVerse — Vũ Trụ Điện Ảnh & Đặt Vé Phim 3D</title>
  <meta name="description" content="Nền tảng trải nghiệm điện ảnh vũ trụ 3D, xem thông tin phim, đánh giá, thảo luận và đặt vé xem phim trực tuyến hiện đại.">
  
  <!-- Google Fonts: Bebas Neue (Cinematic Display Font) & Plus Jakarta Sans (Clean Modern Body Font) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet">
  
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <!-- Three.js ES Module Import Map -->
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.143.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.143.0/examples/jsm/"
      }
    }
  </script>

  <!-- CSS Design System -->
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- 3D Cosmos Background Canvas -->
  <canvas id="bg-canvas"></canvas>

  <!-- App Shell -->
  <div id="app"></div>

  <!-- Toast Notification Container -->
  <div id="toast-container" class="toast-container"></div>

  <!-- Loading Screen Overlay -->
  <div id="loading-overlay" class="loading-overlay hidden">
    <div class="spinner-box">
      <div class="circle-core"></div>
      <div class="orbit-spinner"></div>
      <p class="loading-text" id="loading-text">Đang tải vũ trụ MultiVerse...</p>
    </div>
  </div>

  <!-- Back To Top Button -->
  <button id="back-to-top" class="back-to-top" aria-label="Lên đầu trang">
    <i class="fa-solid fa-arrow-up"></i>
  </button>

  <!-- Application Scripts -->
  <script type="module" src="three-bg.js"></script>
  <script src="app.js"></script>
  <script src="components.js"></script>
  <script src="pages.js"></script>
</body>
</html>
